# Squid configuration with SSL bump and HTTP method controls

# ============================================================
# SSL Bump configuration
# ============================================================
sslcrtd_program /usr/lib/squid/security_file_certgen -s /squid-data/ssl_db -M 4MB
sslcrtd_children 5

http_port 3128 ssl-bump \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=4MB \
  tls-cert=/etc/squid/ssl_cert/squid-cert.pem \
  tls-key=/etc/squid/ssl_cert/squid-key.pem

# ============================================================
# ACL definitions
# ============================================================
acl Safe_ports port 80
acl Safe_ports port 443
acl SSL_ports  port 443

acl TrustedDomains dstdomain \
    opencode.ai \
    registry.npmjs.org \
    api.github.com \
    api.anthropic.com \
    platform.claude.com \
    mcp-proxy.anthropic.com \
    docs.lanchain.com \
    .obsidian.md

acl DomainsWithPost dstdomain api.anthropic.com platform.claude.com docs.langchain.com
acl PostMethod  method POST
acl SafeMethods method GET CONNECT OPTIONS HEAD

acl step1 at_step SslBump1
acl step2 at_step SslBump2
acl step3 at_step SslBump3

acl denied http_status 403

# ============================================================
# Body size limits
# ============================================================
reply_body_max_size 100 MB all
request_body_max_size 1 MB DomainsWithPost

# ============================================================
# SSL bump stages
# ============================================================
ssl_bump peek step1
ssl_bump bump TrustedDomains
ssl_bump terminate all

# ============================================================
# Access control
# ============================================================
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager

http_access allow TrustedDomains SafeMethods
http_access allow DomainsWithPost PostMethod
http_access deny all

# ============================================================
# Cache and logging
# ============================================================
cache deny all

logformat denylog %ts.%03tu %>a %Ss/%03>Hs %rm %ru %ssl::>sni
access_log stdio:/dev/stdout denylog denied
logfile_rotate 0